/* ---------- задания: каждый раунд новое ---------- */
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е');
function makeTask(){
  const others=alive().filter(p=>p.id!==0);
  const kinds=['word','word','word','mention','question','short','photo','emoji','number','long','ask','exclaim','agree'];
  for(let t=0;t<20;t++){
    const k=pick(kinds);let task=null;
    if(k==='word'){const [w,st]=pick(WORDS);task={key:'w'+w,kind:'word',need:1,text:`Вставь в реплику слово «${w}» так, чтобы никто не заподозрил.`,test:m=>norm(m).includes(st)};}
    if(k==='mention'&&others.length>=3)task={key:'mention',kind:'mention',need:1,text:'Назови по имени троих игроков в одной реплике.',test:m=>others.filter(p=>norm(m).includes(norm(p.name).slice(0,3))).length>=3};
    if(k==='question')task={key:'question',kind:'question',need:2,text:'Задай в чате два вопроса: две реплики со знаком «?».',test:m=>m.includes('?')};
    if(k==='short')task={key:'short',kind:'short',need:1,text:'Ответь всего одним словом: реплика из одного слова, от трёх букв.',test:m=>/^\S{3,}$/.test(m.trim())};
    if(k==='photo')task={key:'photo',kind:'photo',need:1,text:'Фотозадание: прикрепи в чат снимок, который лагерь сочтёт самым смешным.',test:()=>false};
    if(k==='emoji')task={key:'emoji',kind:'emoji',need:2,text:'Две реплики подряд с эмодзи. Пусть думают, что ты просто весёлый.',test:m=>/\p{Extended_Pictographic}/u.test(m)};
    if(k==='number')task={key:'number',kind:'number',need:1,text:'Упомяни в реплике любое число, например время или километры.',test:m=>/\d/.test(m)};
    if(k==='long')task={key:'long',kind:'long',need:1,text:'Произнеси речь: одна реплика минимум из 12 слов.',test:m=>m.trim().split(/\s+/).length>=12};
    if(k==='ask'&&others.length){const x=pick(others);task={key:'ask'+x.id,kind:'ask',need:1,text:`Задай прямой вопрос игроку ${esc(x.name)}: его имя и знак «?» в одной реплике.`,test:m=>norm(m).includes(norm(x.name).slice(0,3))&&m.includes('?')};}
    if(k==='exclaim')task={key:'exclaim',kind:'exclaim',need:2,text:'Покажи эмоции: две реплики с восклицательным знаком.',test:m=>m.includes('!')};
    if(k==='agree')task={key:'agree',kind:'agree',need:1,text:'Согласись с кем-нибудь: напиши «согласен» или «согласна».',test:m=>/соглас/.test(norm(m))};
    if(task&&!S.usedTasks.includes(task.key)){S.usedTasks.push(task.key);return task;}
  }
  S.usedTasks=[];return {key:'wкарта',kind:'word',need:1,text:'Вставь в реплику слово «карта».',test:m=>norm(m).includes('карт')};
}
function taskHit(m){
  if(S.taskDone||!S.task||!me().alive)return;
  if(!S.task.test(m))return;
  S.taskProg++;
  if(S.taskProg>=S.task.need)completeTask();
  else toast('Задание: '+S.taskProg+' из '+S.task.need);
}
function completeTask(){
  S.taskDone=true;addPts(2,'Тайное задание',S.task.kind==='photo'?'Фотограф':'Хамелеон');
  const k=$('#task');if(k){k.classList.add('done');k.innerHTML='<b>Задание выполнено</b>';}
}

/* ---------- фото игроков ---------- */
function shrink(file,max,square,cb){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    try{
      let sw=img.width,sh=img.height,sx=0,sy=0,w,h;
      if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;w=h=max;}
      else{const k=Math.min(1,max/Math.max(sw,sh));w=Math.round(sw*k);h=Math.round(sh*k);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,w,h);
      cb(c.toDataURL('image/jpeg',.82));
    }catch(e){cb(url);}
  };
  img.onerror=()=>toast('Не удалось открыть фото');
  img.src=url;
}
document.addEventListener('change',e=>{
  const f=e.target;if(!f.matches||!f.matches('input[type=file]')||!f.files[0])return;

});

const BADGE_TEXT={'Хамелеон':'Выполнил тайное задание.','Фотограф':'Выполнил фотозадание.','Зоркий глаз':'Проголосовал против диверсанта.','Железная память':'Прошёл ночную игру на память.','Знаток трассы':'Ответил верно на все вопросы конкурса.','Ночной гость':'Диверсия прошла успешно.','Вовремя починил':'Спас игрока от диверсии.','Следопыт-ас':'Нашёл диверсанта по следам.','Выживший':'Дожил до конца игры.','Меткий палец':'Выиграл конкурс на реакцию.','Детектор лжи':'Без ошибок в «Правде или выдумке».','Шифровальщик':'Разгадал все поговорки в эмодзи.','Грамотей':'Собрал все слова из букв.','Калькулятор':'Решил все примеры в «Быстром счёте».','Физиономист':'Узнал всех по фото.','Стальные нервы':'Выиграл «Стоп-кран».'};

/* ---------- действия ---------- */
const ACT={
  pickRole:v=>setup(v),
  target:v=>{
    if(S.night.locked)return;
    const id=+v,p=P(id);S.night.target=id;S.night.locked=true;S.night.ready=true;
    if(S.role==='tracker'){const isBad=bad(p);S.night.info=isBad?`<b>${esc(p.name)}</b>: следы ведут к диверсанту. <span class="tag bad">Диверсант</span>`:`<b>${esc(p.name)}</b>: следы чистые. <span class="tag good">Не диверсант</span>`;S.night.found=isBad;}
    render();
  },
  pad:v=>padPress(+v),
  morning:()=>{resolveNight();go('morning');},
  toDay:()=>{
    if(winner()){finalScoring();go('final');return;}
    if(!me().alive){runSpectate(false);go('spectate');return;}
    go('day');
  },
  chip:v=>{const i=$('#msg');i.value=v;i.focus();},
  send:()=>sendMsg(),
  dictate:()=>dictate(),
  toContest:()=>{startContest();go('contest');},
  answer:v=>{const c=S.contest;if(c.answered)return;c.picked=+v;c.answered=true;if(+v===c.qs[c.i].a){c.score++;haptic('success');}else haptic('error');render();},
  qnext:()=>{const c=S.contest;c.answered=false;c.picked=null;if(c.i<c.qs.length-1){c.i++;render();}else finishQuiz();},
  rtap:()=>reactTap(),
  stap:()=>stopTap(),
  toVote:()=>go('vote'),
  vchoose:v=>{S.vote.choice=+v;render();},
  vsend:()=>{tallyVotes(S.vote.choice);go('result');},
  toNext:()=>{if(winner()){finalScoring();go('final');}else nextRound();},
  specNext:()=>{if(S.spec.end){finalScoring();go('final');}else nextRound();},
  again:()=>{newGame(true);render();},
  tomenu:()=>{clearTimers();MODE='menu';render();}
};

/* ---------- ночь ---------- */
function resolveNight(){
  const al=alive();
  let victim;
  if(S.role==='saboteur'&&me().alive&&S.night.target!==undefined)victim=P(S.night.target);
  else victim=pick(al.filter(p=>!bad(p)));
  let guard=-1;
  const mech=S.players.find(p=>p.role==='mechanic'&&p.alive);
  if(mech)guard=mech.id===0?(S.night.target===undefined?-1:S.night.target):pick(al).id;
  S.victim=victim;S.saved=victim.id===guard;
  if(!S.saved)victim.alive=false;
  const meAlive=me().alive||victim.id===0;
  if(meAlive){
    if(S.role==='saboteur'&&!S.saved)addPts(2,'Диверсия удалась','Ночной гость');
    if(S.role==='mechanic'&&S.saved)addPts(3,'Спас игрока','Вовремя починил');
    if(S.role==='tracker'&&S.night.found)addPts(2,'Нашёл диверсанта по следам','Следопыт-ас');
  }
  const innocents=alive().filter(p=>p.id!==0&&!bad(p)),badBots=alive().filter(p=>bad(p)&&p.id!==0);
  if(S.mem&&S.mem.ok&&badBots.length&&innocents.length){
    const pair=shuffle([pick(badBots),pick(innocents)]);
    S.hint=`Ты слышал шаги у костра. Это были ${esc(pair[0].name)} или ${esc(pair[1].name)}.`;
  }
  if(!me().alive){S.event=null;return;}
  const evs=[];
  if(innocents.length>1)evs.push({k:'radio',title:'Ожила рация',text:`Сквозь помехи слышно: ${esc(pick(innocents).name)} всю ночь на виду у костра, это точно не диверсант.`});
  evs.push({k:'count',title:'Разведка вернулась',text:`Следы показывают: диверсантов в лагере осталось ${alive().filter(bad).length}.`});
  if(badBots.length&&innocents.length){const pr=shuffle([pick(badBots),pick(innocents)]);evs.push({k:'tracks',title:'Свежие следы',text:`Следы у техники ведут к двум палаткам: ${esc(pr[0].name)} и ${esc(pr[1].name)}. Кто-то из них точно ходил к стоянке.`});}
  evs.push({k:'fog',title:'Туман над степью',text:'Видимость нулевая, никто не видел, что было у соседних палаток. Полагайтесь на слова.'});
  evs.push({k:'stars',title:'Звездопад',text:'Ночью над степью падали звёзды. Каждый загадал желание: всем живым по очку.'});
  evs.push({k:'convoy',title:'Чужая колонна',text:'Под утро мимо лагеря прошла чужая колонна. Шум разбудил всех, но никто ничего толком не разглядел.'});
  if(badBots.length&&innocents.length>1){const tr=shuffle([pick(badBots),...shuffle(innocents).slice(0,2)]);evs.push({k:'glove',title:'Перчатка у стоянки',text:`У техники нашли перчатку в бензине. Такие перчатки у троих: ${esc(tr[0].name)}, ${esc(tr[1].name)}, ${esc(tr[2].name)}.`});}
  evs.push({k:'find',title:'Находка в лагере',text:'В палатке нашли термос с горячим чаем. Всем живым игрокам по очку за бодрость.'});
  const pool=evs.filter(e=>e.k!==S.lastEvent);
  S.event=pick(pool.length?pool:evs);S.lastEvent=S.event.k;
  if(S.event.k==='find')addPts(1,'Находка в лагере');if(S.event.k==='stars')addPts(1,'Звездопад');
}

let SEQ=[];
function startMemory(){
  const len=Math.min(7,3+S.round);

/* ---------- чат и голосовой ввод ---------- */
function addMsg(who,text,mine,img){
  const c=$('#chat');if(!c)return;
  const d=document.createElement('div');d.className='msg'+(mine?' me':'');
  const b=document.createElement('b');b.textContent=who;d.appendChild(b);
  if(text)d.appendChild(document.createTextNode(text));
  if(img){const im=document.createElement('img');im.src=img;im.alt='Фото из чата';d.appendChild(im);}
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function startChat(){
  if(S.chat.length)S.chat.forEach(m=>addMsg(m.who,m.text,m.mine,m.img));
  if(S.chatStarted)return;
  S.chatStarted=true;
  const bots=shuffle(alive().filter(p=>p.id!==0));
  const dead=S.players.filter(p=>!p.alive);
  bots.forEach((b,i)=>{
    timers.push(setTimeout(()=>{
      const others=alive().filter(p=>p.id!==b.id);
      const cands=bad(b)?others.filter(p=>!bad(p)):others;
      const target=pick(cands.length?cands:others);
      let bank=bad(b)||Math.random()<.5?BOT_ACCUSE:BOT_CALM.concat(BOT_ACCUSE);
      if(target.id===0)bank=bank.filter(t=>t.includes('{X},'));
      let text=fmt(pick(bank),b,target.id===0?{name:'ты'}:target);
      text=text.replace(/^ты/,'Ты');
      if(i===0&&dead.length&&S.round>1){const d=pick(dead);text=`Жаль, что ${d.name} ${FEM(d)?'выбыла':'выбыл'}. Надо быть осторожнее.`;}
      S.chat.push({who:b.name,text});addMsg(b.name,text);
    },1200+i*1800));
  });
}
function sendMsg(){
  const i=$('#msg');const t=i.value.trim();if(!t)return;
  S.chat.push({who:'Ты',text:t,mine:true});addMsg('Ты',t,true);i.value='';
  haptic('light');taskHit(t);botReply(t);
}
/* боты отвечают: на упоминание имени оправдываются, на вопрос отвечает кто-то из лагеря */
function botReply(t){
  const bots=alive().filter(p=>p.id!==0);if(!bots.length)return;
  const named=bots.filter(b=>norm(t).includes(norm(b.name).slice(0,3)));
  let who=null,bank=null;
  if(named.length){who=pick(named);bank=BOT_DEFEND;}
  else if(t.includes('?')||Math.random()<.35){who=pick(bots);bank=BOT_ANSWER;}
  if(!who)return;
  const others=alive().filter(p=>p.id!==who.id&&p.id!==0);
  const cands=bad(who)?others.filter(p=>!bad(p)):others;
  const x=pick(cands.length?cands:(others.length?others:[me()]));
  if(x.id===0)bank=bank.filter(t=>t.includes('{X},')||!t.includes('{X}'));
  const text=fmt(pick(bank),who,x.id===0?{name:'ты'}:x).replace(/^ты/,'Ты');
  timers.push(setTimeout(()=>{S.chat.push({who:who.name,text});addMsg(who.name,text);},900+rnd(900)));
}
let REC=null;
function dictate(){
  const st=$('#dictst'),inp=$('#msg'),btn=$('#dict');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fallback=why=>{st.textContent=(why?why+' ':'')+'Нажми на микрофон на клавиатуре телефона, чтобы продиктовать. Поле уже выбрано.';inp.focus();if(btn)btn.textContent='Диктовать голосом';REC=null;};
  if(REC){try{REC.stop();}catch(e){}return;}
  if(!SR){fallback('Здесь нет встроенного распознавания речи.');return;}
  try{
    const r=new SR();REC=r;r.lang='ru-RU';r.interimResults=true;r.continuous=false;
    r.onstart=()=>{st.textContent='Слушаю… говори, потом нажми ещё раз, чтобы закончить.';btn.textContent='Остановить';};
    r.onresult=e=>{let t='';for(let k=0;k<e.results.length;k++)t+=e.results[k][0].transcript;inp.value=t;};
    r.onerror=e=>fallback(e.error==='not-allowed'||e.error==='service-not-allowed'?'Доступ к микрофону не дан.':'Не удалось распознать речь.');
    r.onend=()=>{if(REC){REC=null;btn.textContent='Диктовать голосом';if(inp.value)st.textContent='Проверь текст и нажми «Отправить».';}};
    r.start();
  }catch(e){fallback('Распознавание не запустилось.');}
}

const CONTEST_TITLE={quiz:'Знаток трассы',truth:'Правда или выдумка',emoji:'Поговорка в эмодзи',anagram:'Слово из букв',math:'Быстрый счёт',react:'Лови огонь',stop:'Стоп-кран',photo:'Чьё лицо?'};
const PERFECT_BADGE={quiz:'Знаток трассы',truth:'Детектор лжи',emoji:'Шифровальщик',anagram:'Грамотей',math:'Калькулятор',photo:'Физиономист'};
/* берёт n ещё не использованных номеров из банка, при нехватке начинает банк заново */
function takeFresh(bankLen,usedKey,n){
  let used=(USED[usedKey]||[]).filter(i=>i<bankLen);
  let free=[...Array(bankLen).keys()].filter(i=>!used.includes(i));
  if(free.length<n){used=[];free=[...Array(bankLen).keys()];}
  const out=shuffle(free).slice(0,n);USED[usedKey]=used.concat(out);STORE.set('used',USED);return out;
}
function mixed(right,wrongs){const o=shuffle([right,...wrongs]);return {o,a:o.indexOf(right)};}
function scramble(w){const up=w.toUpperCase();for(let t=0;t<20;t++){const s=shuffle([...up]).join('');if(s!==up)return s;}return up;}
function startContest(){
  const photoOwners=S.players.filter(p=>p.id!==0&&S.photos[p.id]);
  const types=['quiz','truth','emoji','anagram','math','react','stop'];
  if(photoOwners.length>=2)types.push('photo','photo');
  S.recent=S.recent||[];
  const fresh=types.filter(t=>!S.recent.includes(t));
  const type=pick(fresh.length?fresh:types);
  S.recent.push(type);if(S.recent.length>3)S.recent.shift();S.lastContest=type;
  const c={type,title:CONTEST_TITLE[type],done:false,i:0,score:0,answered:false,picked:null,times:[],labels:{},scores:{}};
  const qs=[];
  if(type==='photo'){
    shuffle(photoOwners).slice(0,3).forEach(o=>{
      const names=shuffle(NAMES.filter(n=>n!==o.name)).slice(0,3);
      const m=mixed(o.name,names);
      qs.push({q:'Чьё это фото? Кадр показан крупным планом.',...m,img:S.photos[o.id],zoom:380+rnd(120),px:20+rnd(60),py:20+rnd(60)});
    });
  }
  if(type==='quiz'||type==='photo'){
    takeFresh(QBANK.length,'usedQ',3-qs.length).forEach(i=>{const b=QBANK[i];qs.push({q:b[0],...mixed(b[1],b.slice(2))});});
  }
  if(type==='truth'){
    takeFresh(TRUTH.length,'usedT',4).forEach(i=>{const [s,v]=TRUTH[i];qs.push({q:'Правда или выдумка?',big:s,bigSmall:true,o:['Правда','Выдумка'],a:v?0:1});});
  }
  if(type==='emoji'){
    takeFresh(EMOJI.length,'usedE',3).forEach(i=>{const [e,ans]=EMOJI[i];const wr=shuffle(EMOJI.filter((_,k)=>k!==i).map(x=>x[1])).slice(0,3);qs.push({q:'Какая поговорка зашифрована?',big:e,...mixed(ans,wr)});});
  }
  if(type==='anagram'){
    takeFresh(WORDS.length,'usedA',3).forEach(i=>{const w=WORDS[i][0];const wr=shuffle(WORDS.filter((_,k)=>k!==i).map(x=>x[0])).slice(0,3);qs.push({q:'Какое слово спряталось в буквах?',big:scramble(w),...mixed(w,wr)});});
  }
  if(type==='math'){
    for(let k=0;k<4;k++){
      const op=pick(['+','−','×']);let x,y,r;
      if(op==='+'){x=12+rnd(80);y=12+rnd(80);r=x+y;}
      if(op==='−'){x=40+rnd(60);y=11+rnd(x-20);r=x-y;}
      if(op==='×'){x=3+rnd(10);y=4+rnd(9);r=x*y;}
      const wr=new Set();for(const d of shuffle([1,2,10,-1,-2,-10,3,-3]))if(wr.size<3&&r+d>0)wr.add(String(r+d));
      qs.push({q:'Сколько будет?',big:`${x} ${op} ${y}`,...mixed(String(r),[...wr])});
    }
  }
  if(type==='stop'){c.tries=[];c.phase='idle';}
  c.qs=qs;S.contest=c;
}
function finishQuiz(){
  const c=S.contest,al=alive(),n=c.qs.length;
  al.forEach(p=>{c.scores[p.id]=p.id===0?c.score:Math.min(n,Math.max(0,Math.round(n*(.35+Math.random()*.55))));c.labels[p.id]=c.scores[p.id]+' из '+n;});
  al.filter(p=>p.id!==0).forEach(p=>S.botPts[p.id]+=c.scores[p.id]);
  const best=Math.max(...al.map(p=>c.scores[p.id]));
  const top=al.filter(p=>c.scores[p.id]===best).map(p=>p.id);
  c.winner=top.includes(0)?0:pick(top);S.immune=c.winner;
  if(c.score>0)addPts(c.score,'Верные ответы: '+c.title);
  if(c.score===n&&PERFECT_BADGE[c.type]&&!S.badges.includes(PERFECT_BADGE[c.type]))S.badges.push(PERFECT_BADGE[c.type]);
  if(c.winner===0)addPts(2,'Победа в конкурсе');
  c.done=true;render();
}
/* «Стоп-кран»: останови таймер ровно на 5,00 секунды, цифры скрываются через 1,5 секунды */
function stopTap(){
  const c=S.contest;if(!c||c.type!=='stop'||c.done)return;
  if(c.phase==='idle'||c.phase==='shown'){
    c.phase='run';c.t0=performance.now();
    const btn=$('#sbtn'),disp=$('#sdisp');if(btn)btn.textContent='Стоп!';
    const iv=setInterval(()=>{const t=(performance.now()-c.t0)/1000;const d=$('#sdisp');if(!d)return;d.textContent=t<1.5?t.toFixed(2):'?.??';},30);
    timers.push(iv);if(disp)disp.textContent='0.00';
    return;
  }
  if(c.phase==='run'){
    clearTimers();
    const t=Math.round(performance.now()-c.t0);c.tries.push(t);c.phase='shown';haptic('medium');
    if(c.tries.length<2){render();return;}
    finishStop();
  }
}
function finishStop(){
  const c=S.contest,al=alive();
  const myErr=Math.min(...c.tries.map(t=>Math.abs(t-5000)));
  al.forEach(p=>{c.scores[p.id]=p.id===0?myErr:40+rnd(650);c.labels[p.id]='±'+(c.scores[p.id]/1000).toFixed(2)+' с';});
  al.filter(p=>p.id!==0).forEach(p=>S.botPts[p.id]+=c.scores[p.id]<250?2:1);
  const best=Math.min(...al.map(p=>c.scores[p.id]));
  c.winner=al.find(p=>c.scores[p.id]===best).id;S.immune=c.winner;
  if(myErr<300)addPts(1,'Точное чувство времени');
  if(c.winner===0)addPts(2,'Победа в конкурсе','Стальные нервы');
  c.done=true;render();
}
function startReact(){
  const c=S.contest;c.phase='wait';
  timers.push(setTimeout(()=>{c.phase='go';c.t0=performance.now();const b=$('#rbtn');if(b){b.className='rbtn go';b.textContent='Жми!';}},1200+rnd(2200)));

function reactTap(){
  const c=S.contest;if(!c||c.type!=='react'||c.done||c.phase==='none')return;
  let t;
  if(c.phase==='go')t=Math.round(performance.now()-c.t0);

function finishReact(){
  const c=S.contest,al=alive();
  const avg=Math.round(c.times.reduce((a,b)=>a+b,0)/3);
  al.forEach(p=>{c.scores[p.id]=p.id===0?avg:260+rnd(420);c.labels[p.id]=c.scores[p.id]+' мс';});
  al.filter(p=>p.id!==0).forEach(p=>S.botPts[p.id]+=c.scores[p.id]<420?2:1);
  const best=Math.min(...al.map(p=>c.scores[p.id]));
  c.winner=al.find(p=>c.scores[p.id]===best).id;S.immune=c.winner;
  if(avg<450)addPts(1,'Быстрая реакция');
  if(c.winner===0){addPts(2,'Победа в конкурсе','Меткий палец');}
  c.done=true;render();
}

/* ---------- голосование ---------- */
function tallyVotes(myChoice){
  const votes={};
  const al=alive(),badOnes=al.filter(bad);
  if(me().alive)votes[0]=myChoice;
  al.filter(p=>p.id!==0).forEach(b=>{
    const options=al.filter(p=>p.id!==b.id&&p.id!==S.immune);
    let t;
    if(bad(b))t=pick(options.filter(p=>!bad(p)))||pick(options);
    else{
      const hit=badOnes.filter(x=>options.includes(x));
      t=(Math.random()<.55&&hit.length)?pick(hit):pick(options);
    }
    votes[b.id]=t.id;
  });
  const count={};Object.values(votes).forEach(id=>{if(id>=0)count[id]=(count[id]||0)+1;});
  const top=Math.max(0,...Object.values(count));
  const leaders=Object.keys(count).filter(k=>count[k]===top).map(Number);
  S.tally={count,votes};
  S.executed=leaders.length===1&&top>0?P(leaders[0]):null;
  Object.entries(votes).forEach(([id,t])=>{if(+id!==0&&t>=0&&bad(P(t)))S.botPts[+id]+=3;});
  if(S.executed)S.executed.alive=false;
  const mv=myChoice!==null&&myChoice>=0?P(myChoice):null;
  if(me().alive||S.executed&&S.executed.id===0){if(mv&&bad(mv))addPts(3,'Голос против диверсанта','Зоркий глаз');}
  al.forEach(p=>{if(p.id!==0&&p.alive)S.botPts[p.id]+=1;});
}
function runSpectate(includeNight){

    if(winner()){S.spec={lines,end:true};return;}

  S.spec={lines,end:!!winner()};
}

  const myRole=my.role;const win=myRole&&((f.winner==='saboteurs')===(myRole==='saboteur'));
  return `${scene('dawn')}<div class="body"><h1>${f.winner==='camp'?'Лагерь победил':'Победили диверсанты'}</h1>
  <p class="story"><small>Рассказчик</small>${f.winner==='camp'?'Все диверсанты найдены. Утром колонна выезжает на трассу.':'Диверсантов стало не меньше, чем остальных. Колонна так и не тронулась.'} Раундов: ${f.rounds}.${myRole?(win?' Твоя сторона выиграла!':' Твоя сторона проиграла.'):''}</p>
  <h2>Рейтинг</h2><table>${f.rank.map((r,i)=>{const p=OP(r.id)||r;return `<tr><td><span style="display:inline-flex;align-items:center;gap:10px">${i+1}. ${oav(p,28)}${esc(r.name)} <span class="tag ${r.role==='saboteur'?'bad':''}">${ROLE_N[r.role]}</span></span></td><td class="n">${r.pts}</td></tr>`;}).join('')}</table>
  ${my.ledger&&my.ledger.length?`<div class="card"><b>Твои очки: ${my.pts}</b><div class="list" style="margin-top:8px">${my.ledger.map(l=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(l[1])}</span><b style="color:var(--amber)">+${l[0]}</b></div>`).join('')}</div></div>`:''}
  ${my.badges&&my.badges.length?`<h2>Достижения</h2>${my.badges.map(b=>`<div class="badge"><div class="ic">${esc(b[0])}</div><div><b>${esc(b)}</b><div class="muted" style="font-size:14px">${esc(f.badge_text[b]||'')}</div></div></div>`).join('')}`:''}
  ${host?`<button class="btn" data-a="ostart" data-v="1">Ещё партию этим составом</button>`:'<p class="muted">Ведущий может запустить ещё партию.</p>'}
  ${ochatBlock(true)}
  <button class="btn ghost" data-a="oleave">Выйти в меню</button></div>`;
}
function rwait(){return `${scene('night')}<div class="body"><h2>Подключаюсь к лагерю…</h2><p class="muted">Секунду, разжигаем костёр.</p></div>`;}

function orender(){
  if(MODE==='training')return;
  const app=$('#app');let html;
  if(MODE==='menu')html=rmenu();
  else if(!O.st)html=O.err?rmenu():rwait();
  else{const st=O.st;const me=ome();
    if(me&&me.spect&&st.phase!=='lobby'&&st.phase!=='final')html=`${scene('dusk')}<div class="body"><h2>Партия уже идёт</h2><p class="muted">Ты зритель и сыграешь в следующей партии. Раунд ${st.round}.</p>${ogallery()}${ochatBlock(false)}</div>`;
    else html=({lobby:rlobby,night:rnight,morning:rmorning,day:rday,contest:rcontest,vote:rvote,result:rresult,final:rfinal}[st.phase]||rwait)();}
  const focusMsg=document.activeElement&&document.activeElement.id==='msg';const draft=$('#msg')?$('#msg').value:'';
  app.innerHTML=otop()+html;
  const inp=$('#msg');if(inp){inp.value=draft;if(focusMsg)inp.focus();}
  if(O.st&&$('#chat'))O.chat.forEach(ochatAdd);
  if(O.st&&O.st.phase==='night'&&O.st.my&&O.st.my.role==='tourist'&&O.st.my.alive)ostartMemory();
  if(O.st&&O.st.phase==='contest'&&O.st.contest&&O.st.contest.type==='react'&&!O.st.contest.submitted&&ome().alive)oreactStart();
}

/* ---------- действия ---------- */
Object.assign(ACT,{
  ocreate:()=>{MODE='online';O.err='';O.code='';if(O.ws&&O.ws.readyState===1)osend({t:'create'});else{O.want='';O.pendingCreate=true;oconnect();}orender();},
  ojoin:()=>{const c=($('#ocode').value||'').trim().toUpperCase();if(c.length<4){toast('Введи код лагеря из 5 символов');return;}MODE='online';O.err='';if(O.ws&&O.ws.readyState===1)osend({t:'join',room:c});else{O.want=c;oconnect();}orender();},
  otrain:()=>{MODE='training';newGame(true);render();},
  oleave:()=>{osend({t:'leave'});O.st=null;O.code='';MODE='menu';orender();},
  oinvite:()=>{const link=O.link;if(!link){toast('Код лагеря: '+O.code);return;}
    const url='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Заходи в мой лагерь «Дикой поездки»: мафия у костра в степи! Код '+O.code);
    if(TG.w&&TG.w.openTelegramLink)TG.w.openTelegramLink(url);else{try{navigator.clipboard.writeText(link);toast('Ссылка скопирована');}catch(e){toast(link);}}},
  ostart:v=>osend({t:'start',bots:v==='1'}),
  onight:v=>{osend({t:'night',target:+v});haptic('light');},
  opad:v=>opad(+v),
  oready:()=>{osend({t:'ready'});haptic('light');},
  osend:()=>{const i=$('#msg');const t=i.value.trim();if(!t)return;osend({t:'chat',text:t});i.value='';haptic('light');},
  oans:v=>{const L=O.loc;if(L.ans.length>L.i)return;L.ans.push(+v);haptic(+v===O.st.contest.qs[L.i].a?'success':'error');orender();},
  oqnext:()=>{const L=O.loc,c=O.st.contest;if(L.i<c.qs.length-1){L.i++;orender();}else osend({t:'contest',answers:L.ans});},
  ortap:()=>oreactTap(),
  ostap:()=>ostopTap(),
  ovchoose:v=>{O.loc.choice=+v;orender();},
  ovsend:()=>{if(O.loc.choice===undefined)return;osend({t:'vote',target:O.loc.choice});haptic('medium');}
});
/* отправка сообщения клавишей Enter */
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='msg'){e.preventDefault();if(MODE==='online')ACT.osend();else ACT.send();}
  if(e.key==='Enter'&&e.target&&e.target.id==='ocode'){e.preventDefault();ACT.ojoin();}});
/* фото: своё в лобби и фото в чат */
document.addEventListener('change',e=>{const f=e.target;if(MODE!=='online'||!f.files||!f.files[0])return;
  if(f.dataset.ophoto)shrink(f.files[0],320,true,d=>{O.photos[O.st.me]=d;osend({t:'photo',data:d});orender();});
  if(f.dataset.ochat)shrink(f.files[0],560,false,d=>{if(d.length>390000){toast('Фото слишком большое');return;}osend({t:'chat',text:'',img:d});});
});

function bootOnline(){
  const sp=startParam();
  if(sp&&canOnline()){MODE='online';O.want=sp.toUpperCase();oconnect();orender();return;}
  if(canOnline()){oconnect();}   // вернёт в лагерь, если игрок уже в нём
  MODE='menu';orender();
}

if(!TG_PENDING)bootOnline();
</script>
</body>
</html>
